version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: orca
    main: ./cmd/orca
    binary: orca
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/orca-cli/orca/internal/cli.Version={{.Version}}
      - -X github.com/orca-cli/orca/internal/cli.Commit={{.Commit}}
      - -X github.com/orca-cli/orca/internal/cli.Date={{.Date}}

archives:
  - id: orca
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
