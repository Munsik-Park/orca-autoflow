version: "2"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/orca-cli/orca

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - revive

  settings:
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
        - name: error-return
          severity: warning
        - name: error-naming
          severity: warning
        - name: if-return
          severity: warning
        - name: increment-decrement
          severity: warning
        - name: var-declaration
          severity: warning
        - name: package-comments
          severity: warning
          disabled: false

  exclusions:
    rules:
      # Test files can use unexported test helpers without issue.
      - path: "_test\\.go"
        linters:
          - revive
          - gocritic
