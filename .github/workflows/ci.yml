name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches:
      - main

jobs:
  test:
    name: test (${{ matrix.os }})
    # macOS runners are 10x more expensive; only run on push to main.
    # Pull requests always run ubuntu for fast feedback.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run-always: true
          - os: macos-latest
            run-always: false

    steps:
      - name: Checkout
        if: matrix.run-always || github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.run-always || github.event_name == 'push'
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        if: matrix.run-always || github.event_name == 'push'
        run: go vet ./...

      - name: Lint
        if: matrix.run-always || github.event_name == 'push'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        if: matrix.run-always || github.event_name == 'push'
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: (matrix.run-always || github.event_name == 'push') && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
